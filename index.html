<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Token Portal</title>
  
  <!-- Supabase Official JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s ease;
    }
    input:focus, textarea:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    button.submit-btn {
      width: 100%;
      padding: 13px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button.submit-btn:hover {
      background: #1e293b;
    }
    button.submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* Result Card */
    .token-result {
      display: none;
      margin-top: 24px;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .token-badge {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .token-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .token-value {
      font-size: 36px;
      font-weight: 800;
      color: #2563eb;
      margin: 6px 0;
    }
    .token-info {
      text-align: left;
      font-size: 13px;
      color: #334155;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-top: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Token Registration</h2>
    <p class="subtitle">Apna serial token number paane ke liye form bharein</p>

    <form id="tokenForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="custName">Customer Name</label>
        <input type="text" id="custName" placeholder="Jaise: Rajesh Kumar" required>
      </div>

      <div class="form-group">
        <label for="custMobile">Mobile Number</label>
        <input type="tel" id="custMobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
      </div>

      <div class="form-group">
        <label for="custCity">City</label>
        <input type="text" id="custCity" placeholder="Jaise: Jaipur" required>
      </div>

      <div class="form-group">
        <label for="custAddress">Full Address</label>
        <textarea id="custAddress" placeholder="Colony / Area / Landmark" required></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="submit-btn">Token Generate Karein</button>
    </form>

    <div id="resultCard" class="token-result">
      <div class="token-badge">SUCCESS</div>
      <div class="token-label">SERIAL TOKEN NUMBER</div>
      <div class="token-value" id="displayToken">---</div>
      
      <div class="token-info" id="displayDetails"></div>

      <button type="button" onclick="resetFormView()" class="submit-btn" style="background: #e2e8f0; color: #1e293b; margin-top: 14px;">
        + Naya Token Banayein
      </button>
    </div>
  </div>

  <script>
    // ===== APNI DETAILS YAHAN DALEIN =====
    const SUPABASE_URL = "https://yyzvpjmejzbblunkyadp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5enZwam1lanpiYmx1bmt5YWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTU5NjcsImV4cCI6MjEwMDc5MTk2N30.S5XXzQBQQp6bo0jGGe0KBxdGoSdjzGjRFUqjK3y8KCM";
    // ======================================

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById("btnSubmit");
      const name = document.getElementById("custName").value.trim();
      const mobile = document.getElementById("custMobile").value.trim();
      const city = document.getElementById("custCity").value.trim();
      const address = document.getElementById("custAddress").value.trim();

      btn.disabled = true;
      btn.innerText = "Token create ho raha hai...";

      try {
        const { data, error } = await supabaseClient
          .from('tokens')
          .insert([
            {
              customer_name: name,
              mobile: mobile,
              city: city,
              address: address
            }
          ])
          .select('token_no, created_at, customer_name, mobile, city, address')
          .single();

        if (error) {
          throw error;
        }

        // Date and Time format
        const dateObj = new Date(data.created_at);
        const dateStr = dateObj.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        // Display Token Info
        document.getElementById("displayToken").innerText = data.token_no;
        document.getElementById("displayDetails").innerHTML = `
          <strong>Customer:</strong> ${data.customer_name}<br>
          <strong>Mobile:</strong> ${data.mobile}<br>
          <strong>City:</strong> ${data.city}<br>
          <strong>Address:</strong> ${data.address}<br>
          <strong>Date:</strong> ${dateStr} | <strong>Time:</strong> ${timeStr}
        `;

        document.getElementById("tokenForm").style.display = "none";
        document.getElementById("resultCard").style.display = "block";

      } catch (err) {
        alert("Error: " + (err.message || "Data save nahi hua"));
        console.error("Full error:", err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Token Generate Karein";
      }
    }

    function resetFormView() {
      document.getElementById("tokenForm").reset();
      document.getElementById("tokenForm").style.display = "block";
      document.getElementById("resultCard").style.display = "none";
    }
  </script>
</body>
</html>
